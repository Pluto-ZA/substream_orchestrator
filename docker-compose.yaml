services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      coolify:
        aliases:
          - wallet_balance_orchestrator
networks:
  coolify:
    external: true
    name: coolify
